<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Profile</title>
<link rel="stylesheet" href="css/style.css" />
<script src="js/theme.js"></script>
</head>
<body>

<div class="bg-scene">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<div class="profile-page">
  <div class="mytasks-top-row">
    <button onclick="history.back()" class="back-link">← Back</button>
    <button id="theme-toggle-btn" class="theme-toggle-btn" title="Toggle theme">
  <svg class="icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
  <svg class="icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
</button>
  </div>

  <div class="profile-card">
    <button id="edit-btn" class="edit-btn" title="Edit profile">✏️</button>

    <div class="avatar-wrap">
      <div class="profile-avatar" id="profile-avatar">?</div>
      <img id="profile-avatar-img" class="profile-avatar-img" style="display:none;" />
      <label for="avatar-input" id="avatar-upload-label" class="avatar-upload-label" style="display:none;">📷</label>
      <input type="file" id="avatar-input" accept="image/*" style="display:none;" />
    </div>

    <!-- VIEW MODE -->
    <div id="view-mode">
      <h3 id="profile-name">Loading...</h3>
      <p class="profile-email" id="profile-email"></p>
    </div>

    <!-- EDIT MODE -->
    <form id="edit-form" class="edit-form" style="display:none;">
      <label>Name</label>
      <input type="text" id="edit-name" required />

      <label>Email</label>
      <input type="email" id="edit-email" required />

      <div class="edit-actions">
        <button type="button" id="cancel-edit-btn" class="btn-secondary">Cancel</button>
        <button type="submit" class="btn-primary">Save Changes</button>
      </div>
      <p class="error-msg" id="edit-error"></p>
    </form>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
