<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Task Manager - Login</title>
<link rel="stylesheet" href="css/style.css" />
<script src="js/theme.js"></script>
</head>
<body>

<div class="bg-scene">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<button id="theme-toggle-btn" class="theme-toggle-floating" title="Toggle theme">
  <svg class="icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
  <svg class="icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
</button>

<div class="auth-container">
  <div class="auth-card">
    <div class="brand">
      <svg class="brand-icon-svg" width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L22 12L12 22L2 12L12 2Z" fill="var(--color-accent)"/>
        <path d="M12 7L17 12L12 17L7 12L12 7Z" fill="var(--color-bg-deep)" opacity="0.5"/>
      </svg>
      <h1>Flowlist</h1>
    </div>
    <p class="subtitle">Organize your work. Find your flow.</p>

    <div class="tabs">
      <button class="tab-btn active" data-tab="login">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Login
      </button>
      <button class="tab-btn" data-tab="register">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="17" y1="11" x2="23" y2="11"/></svg>
        Register
      </button>
    </div>

    <form id="login-form" class="auth-form active">
      <label>Email</label>
      <div class="input-icon-wrap">
        <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z" opacity="0"/><path d="M22 6l-10 7L2 6"/><rect x="2" y="4" width="20" height="16" rx="2"/></svg>
        <input type="email" id="login-email" placeholder="you@example.com" required />
      </div>

      <div class="label-row">
        <label>Password</label>
        <a href="#" id="forgot-password-link" class="forgot-link">Forgot password?</a>
      </div>
      <div class="input-icon-wrap">
        <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input type="password" id="login-password" placeholder="••••••••" required />
      </div>

      <button type="submit" class="btn-primary" id="login-submit-btn">
        <span class="btn-label">Log In <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></span>
      </button>
      <p class="error-msg" id="login-error"></p>
    </form>

    <form id="register-form" class="auth-form">
      <label>Full name</label>
<div class="input-icon-wrap">
  <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
  <input type="text" id="register-name" placeholder="Your name" required />
</div>

      <label>Email address</label>
      <div class="input-icon-wrap">
  <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 6l-10 7L2 6"/><rect x="2" y="4" width="20" height="16" rx="2"/></svg>
  <input type="email" id="register-email" placeholder="you@example.com" required />
</div>

      <label>Password</label>
      <div class="input-icon-wrap">
  <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
  <input type="password" id="register-password" placeholder="At least 6 characters" required minlength="6" />
</div>

      <div class="password-strength" id="password-strength" style="display:none;">
        <div class="strength-bar-track">
          <div class="strength-bar-fill" id="strength-bar-fill"></div>
        </div>
        <span class="strength-label" id="strength-label"></span>
      </div>

      <label class="terms-row">
        <input type="checkbox" id="register-terms" required />
        <span>I agree to the <a href="#" target="_blank">Terms &amp; Privacy Policy</a></span>
      </label>

      <button type="submit" class="btn-primary" id="register-submit-btn">
        <span class="btn-label">Create Account</span>
      </button>
      <p class="error-msg" id="register-error"></p>
    </form>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
