<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Task Manager - Login</title>
<link rel="stylesheet" href="css/style.css" />
<script src="js/theme.js"></script>
</head>
<body>

<div class="bg-scene">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<button id="theme-toggle-btn" class="theme-toggle-floating" title="Toggle theme">
  <svg class="icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
  <svg class="icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
</button>

<div class="auth-container">
  <div class="auth-card">
    <div class="brand">
      <span class="brand-icon">◆</span>
      <h1>Flowlist</h1>
    </div>
    <p class="subtitle">Organize your work. Find your flow.</p>

    <div class="tabs">
      <button class="tab-btn active" data-tab="login">Login</button>
      <button class="tab-btn" data-tab="register">Register</button>
    </div>

    <form id="login-form" class="auth-form active">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="you@example.com" required />

      <div class="label-row">
        <label>Password</label>
        <a href="#" id="forgot-password-link" class="forgot-link">Forgot password?</a>
      </div>
      <div class="password-wrap">
        <input type="password" id="login-password" placeholder="••••••••" required />
        <button type="button" class="toggle-password-btn" data-target="login-password" title="Show password">👁️</button>
      </div>

      <button type="submit" class="btn-primary" id="login-submit-btn">
        <span class="btn-label">Log In</span>
      </button>
      <p class="error-msg" id="login-error"></p>
    </form>

    <form id="register-form" class="auth-form">
      <label>Full name</label>
      <input type="text" id="register-name" placeholder="John Doe" required />

      <label>Email address</label>
      <input type="email" id="register-email" placeholder="john@example.com" required />

      <label>Password</label>
      <div class="password-wrap">
        <input type="password" id="register-password" placeholder="At least 6 characters" required minlength="6" />
        <button type="button" class="toggle-password-btn" data-target="register-password" title="Show password">👁️</button>
      </div>

      <div class="password-strength" id="password-strength" style="display:none;">
        <div class="strength-bar-track">
          <div class="strength-bar-fill" id="strength-bar-fill"></div>
        </div>
        <span class="strength-label" id="strength-label"></span>
      </div>

      <label class="terms-row">
        <input type="checkbox" id="register-terms" required />
        <span>I agree to the <a href="#" target="_blank">Terms &amp; Privacy Policy</a></span>
      </label>

      <button type="submit" class="btn-primary" id="register-submit-btn">
        <span class="btn-label">Create Account</span>
      </button>
      <p class="error-msg" id="register-error"></p>
    </form>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
