<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Task Manager - Login</title>
<link rel="stylesheet" href="css/style.css" />
<script src="js/theme.js"></script>
</head>
<body>

<div class="bg-scene">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<button id="theme-toggle-btn" class="theme-toggle-floating" title="Toggle theme">🌙</button>

<div class="auth-container">
  <div class="auth-card">
    <div class="brand">
      <span class="brand-icon">◆</span>
      <h1>Flowlist</h1>
    </div>
    <p class="subtitle">Your tasks, quietly organized.</p>

    <div class="tabs">
      <button class="tab-btn active" data-tab="login">Login</button>
      <button class="tab-btn" data-tab="register">Register</button>
    </div>

    <form id="login-form" class="auth-form active">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="you@example.com" required />

      <label>Password</label>
      <div class="password-wrap">
        <input type="password" id="login-password" placeholder="••••••••" required />
        <button type="button" class="toggle-password-btn" data-target="login-password" title="Show password">👁️</button>
      </div>

      <button type="submit" class="btn-primary">Log In</button>
      <p class="error-msg" id="login-error"></p>
    </form>

    <form id="register-form" class="auth-form">
      <label>Name</label>
      <input type="text" id="register-name" placeholder="Your name" required />

      <label>Email</label>
      <input type="email" id="register-email" placeholder="you@example.com" required />

      <label>Password</label>
      <div class="password-wrap">
        <input type="password" id="register-password" placeholder="At least 6 characters" required minlength="6" />
        <button type="button" class="toggle-password-btn" data-target="register-password" title="Show password">👁️</button>
      </div>

      <button type="submit" class="btn-primary">Create Account</button>
      <p class="error-msg" id="register-error"></p>
    </form>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
