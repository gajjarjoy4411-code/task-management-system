<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Tasks</title>
<link rel="stylesheet" href="css/style.css" />
<script src="js/theme.js"></script>
</head>
<body>

<div class="bg-scene">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<div class="app-layout">

<aside class="sidebar" id="sidebar">
  <div class="sidebar-top">
    <div class="sidebar-brand">
      <svg class="brand-icon-svg" width="26" height="26" viewBox="0 0 24 24" fill="none">
        <path d="M12 2L22 12L12 22L2 12L12 2Z" fill="var(--color-accent)"/>
        <path d="M12 7L17 12L12 17L7 12L12 7Z" fill="var(--color-bg-deep)" opacity="0.5"/>
      </svg>
      <span class="sidebar-brand-text">Flowlist</span>
    </div>
    <button id="sidebar-toggle-btn" class="sidebar-toggle-btn" title="Collapse sidebar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
  </div>

  <nav class="sidebar-nav">
    <a href="dashboard.html" class="sidebar-link">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span class="sidebar-link-text">Dashboard</span>
    </a>
    <a href="mytasks.html" class="sidebar-link">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      <span class="sidebar-link-text">My Tasks</span>
    </a>
    <a href="kanban.html" class="sidebar-link">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
      <span class="sidebar-link-text">Kanban Board</span>
    </a>
    <a href="calendar.html" class="sidebar-link">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span class="sidebar-link-text">Calendar</span>
    </a>
    <a href="favorites.html" class="sidebar-link">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      <span class="sidebar-link-text">Favorites</span>
    </a>
    <a href="profile.html" class="sidebar-link">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span class="sidebar-link-text">Profile</span>
    </a>
  </nav>

  <div class="sidebar-bottom">
    <button id="logout-btn" class="sidebar-link">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      <span class="sidebar-link-text">Logout</span>
    </button>
  </div>
</aside>

<div class="app-main" id="app-main">
<div class="mytasks-page">
  <div class="mytasks-top-row">
    <button onclick="history.back()" class="back-link">← Back</button>
    <button id="theme-toggle-btn" class="theme-toggle-btn" title="Toggle theme">
  <svg class="icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
  <svg class="icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
</button>
  </div>

  <section class="tasks-toolbar">
    <h2>⭐ Favorites</h2>
  </section>

  <!-- WORKSPACES -->
  <section class="workspace-tabs" id="workspace-tabs">
    <button class="workspace-tab active" data-workspace="">All</button>
  </section>

  <section class="filter-bar">
    <input type="text" id="search-input" placeholder="🔍 Search tasks..." />
    <select id="status-filter">
      <option value="">All statuses</option>
      <option value="pending">Pending</option>
      <option value="in-progress">In Progress</option>
      <option value="completed">Completed</option>
    </select>
    <select id="priority-filter">
      <option value="">All priorities</option>
      <option value="high">🔴 High</option>
      <option value="medium">🟡 Medium</option>
      <option value="low">🟢 Low</option>
    </select>
  </section>

  <section id="task-list" class="task-list">
    <p class="empty-msg" id="empty-msg">No tasks yet.</p>
  </section>
</div>

<!-- ADD TASK POPUP (centered) -->
<div id="add-task-drawer" class="drawer-overlay">
  <div class="drawer-panel">
    <div class="drawer-header">
      <h3 id="drawer-title">New Task</h3>
      <button id="close-drawer-btn" class="icon-btn" title="Close">✕</button>
    </div>

    <form id="task-form" class="drawer-form">
      <input type="hidden" id="task-id" value="" />

      <label>Title</label>
      <input type="text" id="task-title" placeholder="Task title..." required />

      <label>Description</label>
      <textarea id="task-description" placeholder="Write as much as you need — this box grows with your text..." rows="4"></textarea>

      <label>Workspace</label>
      <select id="task-workspace"></select>

      <label>Priority</label>
      <div class="priority-picker" id="priority-picker">
        <button type="button" class="priority-option" data-priority="low">🟢 Low</button>
        <button type="button" class="priority-option selected" data-priority="medium">🟡 Medium</button>
        <button type="button" class="priority-option" data-priority="high">🔴 High</button>
      </div>
      <input type="hidden" id="task-priority" value="medium" />

      <label>Deadline</label>
      <input type="date" id="task-deadline" />

      <button type="submit" class="btn-primary" id="task-submit-btn">+ Add Task</button>
      <p class="error-msg" id="task-error"></p>
    </form>
  </div>
</div>

<!-- DELETE CONFIRMATION POPUP -->
<div id="delete-modal" class="modal-overlay">
  <div class="modal-box">
    <h3>Do you want to delete the task?</h3>
    <p>This action cannot be undone.</p>
    <div class="modal-actions">
      <button id="cancel-delete-btn" class="btn-secondary">Cancel</button>
      <button id="confirm-delete-btn" class="btn-primary delete-confirm">Delete</button>
    </div>
  </div>
</div>

<!-- ADD WORKSPACE POPUP -->
<div id="add-workspace-modal" class="modal-overlay">
  <div class="modal-box">
    <h3>New Workspace</h3>
    <form id="add-workspace-form" class="workspace-form">
      <label>Name</label>
      <input type="text" id="new-workspace-name" placeholder="e.g. Fitness" maxlength="20" required />

      <label>Icon</label>
      <div class="icon-picker" id="icon-picker">
        <button type="button" class="icon-option selected" data-icon="⚪">⚪</button>
        <button type="button" class="icon-option" data-icon="🔴">🔴</button>
        <button type="button" class="icon-option" data-icon="🟠">🟠</button>
        <button type="button" class="icon-option" data-icon="🟡">🟡</button>
        <button type="button" class="icon-option" data-icon="🟢">🟢</button>
        <button type="button" class="icon-option" data-icon="🔵">🔵</button>
        <button type="button" class="icon-option" data-icon="🟣">🟣</button>
        <button type="button" class="icon-option" data-icon="🟤">🟤</button>
      </div>

      <p class="error-msg" id="workspace-error"></p>
      <div class="modal-actions">
        <button type="button" id="cancel-add-workspace-btn" class="btn-secondary">Cancel</button>
        <button type="submit" class="btn-primary">Create</button>
      </div>
    </form>
  </div>
</div>

<!-- DELETE WORKSPACE POPUP -->
<div id="delete-workspace-modal" class="modal-overlay">
  <div class="modal-box">
    <h3>Delete this workspace?</h3>
    <p>Any tasks in it will be moved to Personal.</p>
    <div class="modal-actions">
      <button id="cancel-delete-workspace-btn" class="btn-secondary">Cancel</button>
      <button id="confirm-delete-workspace-btn" class="btn-primary delete-confirm">Delete</button>
    </div>
  </div>
</div>

</div>
</div>

<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/favorites.js"></script>
</body>
</html>
